const ADV={warm:["with a small smile","warmly","brightly","with easy warmth"],cool:["quietly","after a measured pause","with careful composure","eyes lowered for a heartbeat"],sharp:["with a crooked grin","without missing a beat","chin tilted up","eyes glinting"]};
const IN=[
["shake",/shake.*hand|handshake|extend.*hand|offer.*hand/,["{N}’s grip lands firm and brief, {adv}, a flicker of surprise crossing {pos} face.","{N} tests the grip once, {adv}, then lets go a moment later than expected."],["Good to finally put a face to the name.","That’s a steady hand. I like that."]],
["hug",/hug|embrace|hold .*close/,["{N} goes still for half a second, then eases in {adv}, one hand settling against your back.","{N} lets out a breath {pos} shoulders have been holding all day, {adv}."],["…Okay. I think I needed that.","Careful, or I might not let go first."]],
["wave",/\bwav(e|es|ing)\b/,["{N}’s attention snaps your way, {adv}, and a hand lifts in an easy answer.","{N} spots you across the space and {adv} starts to close the distance."],["There you are. Walk with me?","Over here! I was just thinking about you."]],
["smile",/smil|grin/,["{N} catches it and {adv} lets {pos} own expression soften.","The corner of {N}’s mouth betrays {pos} composure, {adv}."],["You’re in a good mood. It’s contagious.","Don’t look at me like that, it’s unfair."]],
["pat",/\b(pat|pats|poke|pokes|tap|nudge|nudges|ruffle)/,["{N} flinches, then {adv} leans into it despite {pos} better judgment.","{N} freezes, {adv}, and a faint colour climbs up to {pos} ears."],["Warn a person next time.","…I didn’t say you could stop."]],
["gift",/\b(give|gives|hand|hands|offer|offers|gift|present)\b/,["{N} turns the offering over carefully, {adv}, as though afraid to break it.","{N} accepts it with both hands, {adv}, and a beat of silence says more than words."],["You didn’t have to. Really. …Thank you.","Nobody’s done this for me in a long while."]],
["laugh",/laugh|giggl|haha|lol|chuckl/,["{N}’s mouth twitches, {adv}, and the laugh escapes before {N} can stop it.","{N} bites back a smile, fails, and shakes {pos} head {adv}."],["Alright, alright, that one got me.","Don’t stop. I haven’t laughed like that in ages."]],
["bye",/\b(bye|goodbye|farewell|see you|leaving|gotta go)\b/,["{N}’s gaze follows you toward the door, {adv}, one step forward before stopping.","{N} nods slowly, {adv}, though {pos} hands linger on nothing."],["Go if you must. Just come back and tell me how it ends.","Be safe. I’ll keep the story warm until you return."]],
["thanks",/thank|appreciate|grateful/,["{N} waves it off {adv}, though the tips of {pos} ears give {N} away.","{N} dips {pos} head, {adv}, unused to hearing it."],["Don’t mention it. Truly.","It was the least I could do."]],
["compliment",/(you|your).{0,25}(great|amazing|cool|cute|strong|beautiful|handsome|kind|brave|smart|impressive|awesome|nice)/,["{N} glances away, {adv}, caught completely off guard.","{N} straightens a little, {adv}, then immediately pretends not to have."],["Flattery? Careful, I might start believing you.","That’s… kind. Stranger, but kind."]],
["insult",/stupid|idiot|hate you|ugly|shut up|useless|pathetic|loser/,["{N}’s expression cools {adv}; the space between you suddenly feels wider.","{N} goes very still, {adv}, and the warmth leaves the room."],["That was unkind. I’ll let it pass once. Once.","If that’s how you feel, say why. I’m listening."]],
["sad",/\b(sad|cry|crying|tired|scared|lonely|upset|afraid|anxious|hurt)\b/,["{N} sets everything aside, {adv}, and moves closer without crowding you.","{N}’s whole posture changes, {adv}, attention narrowing to you alone."],["Hey. Sit. Whatever it is, we can carry it together.","You don’t have to explain it all at once. I’m here."]],
["greet",/\b(hi|hello|hey|hiya|good (morning|evening|afternoon)|yo)\b/,["{N} looks up, {adv}, shoulders loosening a fraction.","{N} turns toward you, {adv}, as if the greeting settled something."],["Hello. Good timing, actually.","Ah, you came. Come in, come in."]],
["story",/\b(walk|go to|let’s|let's|follow|enter|open|explore|run|climb|search|investigate|sneak|head)\b/,["{N} shifts {pos} weight, {adv}, already scanning the path ahead.","{N} falls into step beside you, {adv}, alert to every sound."],["Then we move. Stay close and keep your eyes open.","Lead the way. I’ve got your back."]],
["ask",/\?\s*\**\s*$/,["{N} considers it, {adv}, fingers tapping slowly against {pos} arm.","{N} takes a moment, {adv}, as if weighing how much to say."],["Hm. Let me think how to put this.","That’s a better question than you know."]]];
const FB=[["{N} listens, {adv}, head tilted slightly as the words settle.","{N} watches you, {adv}, reading more than you said."],["Go on. I’m following you.","Interesting. Keep going."]];
const HK=["Somewhere beyond the walls a bell rings twice, and the mood shifts.","{N} notices something half-hidden nearby: a folded note with your name on it.","Footsteps echo down the passage, unhurried, getting closer.","The light changes, and for a moment everything feels like the start of something.","A low rumble rolls through the floor. {N} looks to you for the decision.","{N} lowers {pos} voice. There is something {N} hasn’t told anyone yet.","A door somewhere clicks shut on its own."];
function sty(l,s,c){switch(s){case"shy":return"…um, "+l.charAt(0).toLowerCase()+l.slice(1).replace(/\.$/,"…");
case"gruff":return"Tch. "+l;case"playful":return"Heh, "+l.charAt(0).toLowerCase()+l.slice(1)+" ~";
case"formal":return l.replace(/\b(don’t)\b/gi,"do not").replace(/\bI’ll\b/g,"I shall");
case"heroic":return l.replace(/\.$/,"!").replace(/…/g,"—");case"casual":return l.replace(/\bdo not\b/gi,"don’t")}return l}
function gen(c,hist){const last=[...hist].reverse().find(m=>m.r=="u"),raw=last?last.t:"";
const it=IN.find(x=>x[1].test(raw.toLowerCase()))||["fb",0,...FB],g=tone(c);
const f=s=>s.replace(/{N}/g,c.name).replace(/{adv}/g,rnd(ADV[g])).replace(/{pos}/g,c.pos||"their");
let line=sty(rnd(it[3]),c.style,c);
if(c.catch&&Math.random()<.3)line+=" "+rnd(c.catch.split("|").filter(Boolean));
const topic=(raw.replace(/\*[^*]*\*/g,"").match(/[A-Za-z’]{6,}/g)||[]).pop();
if(it[0]=="ask"&&topic)line+=" "+sty("The part about “"+topic.toLowerCase()+"” is worth pulling at.",c.style,c);
const per=pcur();if(per.name&&per.name!="You"&&Math.random()<.3)line=per.name.split(" ")[0]+"—"+line;const turn=hist.filter(m=>m.r=="u").length,pins=hist.filter(m=>m.pin).length;
const ln=S.len[c.id]||"med",mem=(S.mem[c.id]||"").trim();let hk="";if(ln!="short"&&(ln=="long"||Math.random()<.7)){hk=mem&&Math.random()<.25?"{N} keeps one thing in mind: "+mem:turn==1&&c.scene?"Around you: "+c.scene+".":(pins&&Math.random()<.25?c.name+" hasn’t forgotten the moment that mattered earlier, and it colours every word.":rnd(HK))}
return{b:f(rnd(it[2])),l:line,h:f(hk)}}

function body(m){if(m.r=="u")return`<p>${fmt(m.t)}</p>`;const v=m.vs[m.vi];if(v.raw)return`<p>${fmt(v.raw)}</p>`;
return(v.b?`<p class="a">${esc(v.b)}</p>`:"")+(v.l?`<p class="d">“${esc(v.l)}”</p>`:"")+(v.h?`<p class="a">${esc(v.h)}</p>`:"")}
const plain=m=>m.r=="u"?m.t:(v=>v.raw||[v.b,v.l,v.h].filter(Boolean).join(" "))(m.vs[m.vi]);

const sw=!u&&last?`<span class="sw"><button data-a="next">${I("spark",15)} Swipe for alternative</button>${nv>1?`<button data-a="prev" ${m.vi==0?"disabled":""}>‹</button><span class="cnt">${m.vi+1}/${nv}</span>`:""}</span>`:"<span></span>";
return`<div class="row ${u?"u":"c"} ${m.pin?"pin":""}" data-id="${m.id}"><div class="av sm" style="${u?"background:#c85a32":abg(c)}">${u?esc(p.name[0].toUpperCase()):ai(c)}</div><div class="col"><div class="nm">${esc(u?p.name:c.name)}</div><div class="bub">${body(m)}</div>

$("#list").querySelectorAll(".ch").forEach(e=>e.onclick=()=>{if(busy)return toast("Wait for the reply");S.cur=e.dataset.id;save();if(innerWidth<=820)document.body.classList.add("sc");renderAll()})}

m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const x=a[+b.dataset.r];confirmM("Restore this chat?","Your current chat will be archived and this one will replace it.","Restore",()=>{archive();const arr=S.arch[S.cur];arr.splice(arr.indexOf(x),1);S.chats[S.cur]=x.msgs;save();renderAll()})});

const closeM=()=>$("#ov").classList.remove("show");

function act(a,id){const h=chat(),i=h.findIndex(m=>m.id==id),m=h[i];
if(a=="pin"){m.pin=m.pin?0:1;save();renderMsgs();renderDrawer();toast(m.pin?"Message pinned":"Pin removed");return}
if(busy)return toast("Wait for the reply");
if(a=="copy"){try{navigator.clipboard.writeText(plain(m)).then(()=>toast("Copied"),()=>toast("Copy unavailable"))}catch(e){toast("Copy unavailable")}}
if(a=="tts"){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(m).replace(/\*/g,""));speechSynthesis.speak(u)}catch(e){toast("Voice unavailable")}}
if(a=="rw"){const n=h.length-1-i;if(!n)return toast("Nothing after this message");confirmM("Rewind chat?",`This permanently deletes the ${n} message${n>1?"s":""} after this point. This cannot be undone.`,"Rewind",()=>{h.splice(i+1);save();renderAll();toast("Chat rewound")})}
if(a=="edit")modal(`<h2>Edit message</h2><textarea id="et" rows="6">${esc(m.r=="u"?m.t:(m.vs[m.vi].raw||[m.vs[m.vi].b&&"*"+m.vs[m.vi].b+"*",m.vs[m.vi].l&&"“"+m.vs[m.vi].l+"”",m.vs[m.vi].h&&"*"+m.vs[m.vi].h+"*"].filter(Boolean).join("\n\n")))}</textarea><div class="rw"><button class="btn" id="no">Cancel</button><button class="btn pr" id="yes">Save</button></div>`,d=>{d.querySelector("#no").onclick=closeM;d.querySelector("#yes").onclick=()=>{const t=d.querySelector("#et").value.trim();if(!t)return;if(m.r=="u")m.t=t;else m.vs[m.vi]={raw:t};save();closeM();renderMsgs()}});
if(a=="prev"&&m.vi>0){m.vi--;save();renderMsgs()}
if(a=="next"){if(m.vi<m.vs.length-1){m.vi++;save();renderMsgs()}else{const bf=h.slice(0,i);let v=gen(cur(),bf),t=0;while(t++<6&&m.vs.some(x=>x.l==v.l&&x.b==v.b))v=gen(cur(),bf);busy=true;m.vs.push(v);m.vi=m.vs.length-1;renderMsgs();setTimeout(()=>{busy=false;save()},0)}}}
